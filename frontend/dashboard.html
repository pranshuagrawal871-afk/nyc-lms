<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Dashboard — NYC LMS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>

  <div class="ambient-glow ambient-glow--top"></div>
  <div class="ambient-glow ambient-glow--bottom"></div>

  <!-- ================= Top Navbar ================= -->
  <header class="topbar">
    <div class="topbar-container">
      <div class="brand">
        <div class="logo-mark-3d">NYC</div>
        <div class="logo-text">
          <span class="name">NYC LMS</span>
          <span class="tag">Learning Platform</span>
        </div>
      </div>

      <div class="topbar-search">
        <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
        <input type="search" id="dashSearch" class="input-3d" placeholder="Search your courses…" aria-label="Search courses" autocomplete="off" />
      </div>

      <div class="topbar-right">
        <div class="user-pill card-3d">
          <div class="avatar-3d" id="avatar" aria-hidden="true">S</div>
          <span class="student-name" id="studentName">Student</span>
        </div>
        <button class="btn-3d btn-3d--secondary logout-btn" id="logout" type="button">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          Log out
        </button>
      </div>
    </div>
  </header>

  <main class="page-container">

    <!-- ============ Greeting Hero Section ============ -->
    <section class="greeting-hero card-3d" data-tilt data-light-follow>
      <div class="card-3d-content hero-inner">
        <div class="greeting-text">
          <div class="hero-badge">
            <span class="pulse-dot"></span>
            PERSONAL LEARNING DASHBOARD
          </div>
          <h1 id="welcome">Welcome back</h1>
          <p class="sub" id="welcomeSub">Pick up where you left off.</p>
        </div>
        
        <!-- Continue Learning Spotlight Widget (Populated dynamically) -->
        <div class="spotlight-card" id="continueSpotlight" hidden>
          <div class="spotlight-thumb" id="spotlightThumb"></div>
          <div class="spotlight-info">
            <span class="spotlight-kicker">CONTINUE WATCHING</span>
            <h3 class="spotlight-title" id="spotlightTitle">Active Course</h3>
            <div class="spotlight-progress-wrap">
              <div class="spotlight-progress-bar"><div class="spotlight-progress-fill" id="spotlightProgressFill"></div></div>
              <span class="spotlight-pct" id="spotlightPct">0%</span>
            </div>
            <a id="spotlightCta" href="#" class="btn-3d btn-3d--primary btn-sm">Resume Lesson &rarr;</a>
          </div>
        </div>
      </div>
    </section>

    <!-- Filter Pills -->
    <div class="filter-bar">
      <button class="filter-pill active" data-filter="all">All Courses</button>
      <button class="filter-pill" data-filter="progress">In Progress</button>
      <button class="filter-pill" data-filter="completed">Completed</button>
    </div>

    <!-- ============ Enrolled Courses Grid ============ -->
    <section class="dashboard-section" aria-label="Enrolled courses">
      <div class="section-head">
        <h2>My Enrolled Courses</h2>
        <span class="section-count badge-3d badge-3d--orange" id="enrolledCount"></span>
      </div>

      <p class="state-notice" id="enrolledStatus" role="status" aria-live="polite">Loading your courses…</p>
      <div class="course-grid" id="courses"></div>
    </section>

    <!-- ============ Browse Available Courses Grid ============ -->
    <section class="dashboard-section" aria-label="Available courses" id="browseSection" hidden>
      <div class="section-head">
        <h2>Course Catalog</h2>
        <span class="badge-3d badge-3d--neutral">Discover & Enroll</span>
      </div>

      <p class="state-notice" id="browseStatus" role="status" aria-live="polite"></p>
      <div class="course-grid" id="browseGrid"></div>
    </section>

  </main>

  <script src="js/config.js"></script>
  <script src="js/session.js"></script>
  <script src="js/app-3d.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
